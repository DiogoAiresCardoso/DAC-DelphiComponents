; Do not put the password in this file. Set the environment variable named below.

[package]
; One or more existing directories, separated by semicolons.
source_dirs=C:\dados\exportacao;C:\dados\relatorios
; Wildcards, separated by semicolons.
include=*.xml;*.pdf;*.txt
recursive=true
; Relative paths are based on this INI file.
zip_dir=out
zip_name=exportacao_{timestamp}.zip

[ftp]
host=ftp.example.com
port=21
username=integration-user
password_env=ZIPFTP_PASSWORD
remote_dir=/incoming
passive=true
connect_timeout_ms=30000
read_timeout_ms=120000
